services:
  web:
    build: .
    ports:
      - "5003:5003"
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-change-me-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-qwerty}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-12345}
    volumes:
      - ./data:/app/data
    restart: unless-stopped